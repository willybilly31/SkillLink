<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillink : Partage tes talents</title>

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#18202a;
    --muted:#6d7683;
    --border:#e3e7ee;
    --primary:#6366f1;
    --primary-light:#eef0ff;
    --danger:#ef4444;
    --success:#22c55e;
    --sidebar:#ffffff;
    --shadow:0 8px 30px rgba(20,30,50,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body.dark{
    --bg:#10131a;
    --card:#171b23;
    --text:#f1f5f9;
    --muted:#9aa4b2;
    --border:#282e39;
    --primary:#818cf8;
    --primary-light:#242743;
    --sidebar:#141820;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:240px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:22px 15px;
    z-index:20;
}

.logo{
    font-size:24px;
    font-weight:800;
    padding:5px 12px 25px;
}

.logo span{
    color:var(--primary);
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav button{
    border:0;
    background:transparent;
    color:var(--text);
    padding:12px;
    border-radius:12px;
    text-align:left;
}

.nav button:hover,
.nav button.active{
    background:var(--primary-light);
    color:var(--primary);
}

.premium-nav{
    margin-top:12px;
    border:1px solid #e7c94d !important;
    background:#fff8d9 !important;
    color:#8a6a00 !important;
}

body.dark .premium-nav{
    background:#39331b !important;
    color:#f4d96b !important;
}

.main{
    margin-left:240px;
    min-height:100vh;
}

.topbar{
    height:72px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:sticky;
    top:0;
    z-index:10;
}

.topbar h1{
    font-size:22px;
    margin:0;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.content{
    max-width:1000px;
    margin:auto;
    padding:30px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:var(--shadow);
}

.card h2,
.card h3{
    margin-top:0;
}

.btn{
    border:0;
    background:var(--primary);
    color:white;
    border-radius:10px;
    padding:10px 15px;
    font-weight:600;
}

.btn:hover{
    opacity:.9;
}

.btn.secondary{
    background:var(--primary-light);
    color:var(--primary);
}

.btn.danger{
    background:var(--danger);
}

.btn.success{
    background:var(--success);
}

.btn.small{
    padding:7px 10px;
    font-size:13px;
}

.input,
textarea,
select{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:11px;
    outline:none;
}

.input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
}

textarea{
    resize:vertical;
    min-height:100px;
}

.form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--primary-light);
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    flex-shrink:0;
}

.avatar.large{
    width:90px;
    height:90px;
    font-size:28px;
}

.user-row{
    display:flex;
    gap:12px;
    align-items:center;
}

.user-info{
    min-width:0;
}

.user-name{
    font-weight:700;
}

.muted{
    color:var(--muted);
}

.pill{
    display:inline-block;
    padding:4px 8px;
    border-radius:999px;
    font-size:12px;
    background:var(--primary-light);
    color:var(--primary);
    margin:2px;
}

.pill.premium{
    background:#fff1a8;
    color:#8a6900;
}

body.dark .pill.premium{
    background:#49401b;
    color:#f3d45e;
}

.post-text{
    white-space:pre-wrap;
    line-height:1.55;
}

.post-actions{
    display:flex;
    gap:8px;
    border-top:1px solid var(--border);
    margin-top:16px;
    padding-top:12px;
}

.icon-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:7px 10px;
    border-radius:8px;
}

.icon-btn:hover{
    background:var(--primary-light);
    color:var(--primary);
}

.comment{
    padding:10px 0;
    border-top:1px solid var(--border);
}

.comment-form{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.comment-form input{
    flex:1;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.user-card{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.profile-header{
    display:flex;
    gap:20px;
    align-items:center;
}

.profile-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:20px;
}

.stat{
    background:var(--primary-light);
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:22px;
}

.search-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.search-row .input{
    flex:1;
}

.empty{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
}

.notification{
    display:flex;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid var(--border);
}

.unread-dot{
    width:9px;
    height:9px;
    background:var(--primary);
    border-radius:50%;
    margin-top:6px;
}

.chat-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:600px;
}

.conversations{
    border-right:1px solid var(--border);
    padding-right:15px;
}

.conversation{
    display:flex;
    gap:10px;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
}

.conversation:hover,
.conversation.active{
    background:var(--primary-light);
}

.chat{
    display:flex;
    flex-direction:column;
    padding-left:18px;
}

.messages{
    flex:1;
    overflow:auto;
    max-height:480px;
    padding:10px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    border-radius:14px;
    margin:7px 0;
    background:var(--border);
}

.message.me{
    margin-left:auto;
    background:var(--primary);
    color:white;
}

.message-time{
    font-size:11px;
    opacity:.65;
    margin-top:3px;
}

.chat-input{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal{
    width:min(550px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.3);
}

.modal-close{
    float:right;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:22px;
}

.premium-card{
    background:linear-gradient(
        135deg,
        var(--primary-light),
        var(--card)
    );
    border:2px solid #e3c84e;
}

.premium-feature{
    display:flex;
    gap:12px;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--border);
}

.locked{
    opacity:.55;
}

.mobile-nav{
    display:none;
}

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--text);
    color:var(--bg);
    padding:13px 17px;
    border-radius:12px;
    z-index:200;
    box-shadow:var(--shadow);
}

@media(max-width:800px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        padding-bottom:70px;
    }

    .content{
        padding:18px;
    }

    .topbar{
        padding:0 16px;
    }

    .mobile-nav{
        position:fixed;
        display:flex;
        bottom:0;
        left:0;
        right:0;
        background:var(--card);
        border-top:1px solid var(--border);
        z-index:30;
        justify-content:space-around;
        padding:8px 4px;
    }

    .mobile-nav button{
        border:0;
        background:transparent;
        color:var(--muted);
        font-size:11px;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

    .grid{
        grid-template-columns:1fr;
    }

    .chat-layout{
        grid-template-columns:1fr;
    }

    .conversations{
        border-right:0;
        border-bottom:1px solid var(--border);
        padding-bottom:10px;
        margin-bottom:10px;
    }

    .profile-header{
        flex-direction:column;
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<script>
/* =====================================================
   SKILLINK
   Version locale / démonstration
===================================================== */

const STORAGE_KEY = "skillink_data_v2";
const USER_KEY = "skillink_current_user_v2";
const PREMIUM_KEY = "skillink_premium_v2";

const SKILLS = [
    "Programmation",
    "Dessin",
    "Design",
    "Arduino",
    "Électronique",
    "Musique",
    "Mathématiques",
    "Français",
    "Anglais",
    "Montage vidéo",
    "3D / CAO",
    "Jeux vidéo"
];

let currentPage = "home";
let selectedConversation = null;
let searchTerm = "";
let premium = localStorage.getItem(PREMIUM_KEY) === "true";


function uid(prefix="id"){
    return prefix + "_" + Math.random().toString(36).slice(2,10);
}


function escapeHTML(text=""){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function now(){
    return new Date().toISOString();
}


function formatDate(date){
    const d = new Date(date);

    return d.toLocaleString("fr-CA",{
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
    });
}


/* =====================================================
   DATA
===================================================== */

function createInitialData(){

    return {

        users:[

            {
                id:"camille",
                name:"Camille",
                description:"J'aime apprendre de nouvelles choses et aider les autres.",
                skills:["Français","Dessin"],
                level:"Intermédiaire",
                ai:false,
                premium:false
            },

            {
                id:"thomas",
                name:"Thomas",
                description:"Je m'intéresse à la 3D, aux jeux et à la programmation.",
                skills:["3D / CAO","Programmation","Jeux vidéo"],
                level:"Débutant",
                ai:false,
                premium:false
            },

            {
                id:"elodie",
                name:"Élodie",
                description:"Je fais du montage vidéo et du design.",
                skills:["Montage vidéo","Design"],
                level:"Avancé",
                ai:false,
                premium:false
            },

            {
                id:"alex",
                name:"Alex",
                description:"Je peux t'aider avec la programmation et les projets web.",
                skills:["Programmation"],
                level:"Avancé",
                ai:true,
                premium:true
            },

            {
                id:"sophie",
                name:"Sophie",
                description:"Je crée des dessins et des designs numériques.",
                skills:["Dessin","Design"],
                level:"Avancé",
                ai:true,
                premium:true
            },

            {
                id:"noah",
                name:"Noah",
                description:"Je construis des projets avec Arduino et des composants électroniques.",
                skills:["Arduino","Électronique"],
                level:"Avancé",
                ai:true,
                premium:true
            },

            {
                id:"maya",
                name:"Maya",
                description:"Je fais de la musique et j'aime apprendre de nouveaux instruments.",
                skills:["Musique"],
                level:"Intermédiaire",
                ai:true,
                premium:true
            }

        ],

        posts:[

            {
                id:"post1",
                userId:"camille",
                text:"Quelqu'un veut apprendre à dessiner avec moi ? Je peux montrer quelques techniques simples.",
                category:"Dessin",
                createdAt:now(),
                likes:["thomas"],
                comments:[
                    {
                        id:"c1",
                        userId:"thomas",
                        text:"Oui, ça m'intéresse !",
                        createdAt:now()
                    }
                ],
                boosted:false
            },

            {
                id:"post2",
                userId:"thomas",
                text:"Je travaille sur un petit projet 3D. Je cherche des idées pour améliorer mon modèle.",
                category:"3D / CAO",
                createdAt:now(),
                likes:[],
                comments:[],
                boosted:false
            },

            {
                id:"post3",
                userId:"noah",
                text:"Je viens de créer un petit projet Arduino avec une LED et un bouton.",
                category:"Arduino",
                createdAt:now(),
                likes:["camille"],
                comments:[],
                boosted:false
            }

        ],

        helps:[

            {
                id:"help1",
                userId:"thomas",
                title:"Comment commencer avec Arduino ?",
                description:"Je viens d'avoir un Arduino et je ne sais pas trop par où commencer.",
                category:"Arduino",
                createdAt:now(),
                resolved:false,
                answers:[
                    {
                        id:"a1",
                        userId:"noah",
                        text:"Commence par une LED, un bouton et quelques programmes très simples.",
                        createdAt:now()
                    }
                ]
            },

            {
                id:"help2",
                userId:"camille",
                title:"Comment améliorer mes dessins ?",
                description:"Je cherche des exercices simples pour pratiquer.",
                category:"Dessin",
                createdAt:now(),
                resolved:false,
                answers:[]
            }

        ],

        conversations:[],

        notifications:[]

    };
}


let data;


function loadData(){

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){

        try{
            data = JSON.parse(saved);
        }
        catch{
            data = createInitialData();
        }

    }else{

        data = createInitialData();

    }

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function currentUser(){

    const id = localStorage.getItem(USER_KEY);

    return data.users.find(u=>u.id===id) || data.users[0];

}


function currentUserId(){

    return currentUser()?.id;
}


function getUser(id){

    return data.users.find(u=>u.id===id);
}


function avatar(user,large=false){

    if(!user) return "";

    const initial = escapeHTML(
        user.name.charAt(0).toUpperCase()
    );

    return `
        <div class="avatar ${large?"large":""}">
            ${initial}
        </div>
    `;
}


function userName(id){

    const u = getUser(id);

    return u ? escapeHTML(u.name) : "Utilisateur";
}


function premiumBadge(user){

    if(!user) return "";

    if(user.premium || (user.ai && user.id!=="")){
        return `
            <span class="pill premium">
                ⭐ Premium
            </span>
        `;
    }

    return "";
}


/* =====================================================
   APP SHELL
===================================================== */

function render(){

    const user = currentUser();

    document.getElementById("app").innerHTML = `

        <aside class="sidebar">

            <div class="logo">
                Skill<span>ink</span>
            </div>

            <div class="nav">

                ${navButton("home","Accueil","⌂")}

                ${navButton("discover","Découvrir","◉")}

                ${navButton("help","Demandes d'aide","?")}

                ${navButton("messages","Messages","✉")}

                ${navButton("notifications","Notifications","●")}

                ${navButton("profile","Mon profil","○")}

                <button
                    class="premium-nav"
                    onclick="openPremium()">

                    ⭐ Premium

                </button>

                ${navButton("settings","Paramètres","⚙")}

            </div>

        </aside>


        <main class="main">

            <header class="topbar">

                <h1>${pageTitle()}</h1>

                <div class="top-actions">

                    ${
                        premium

                        ?

                        `
                        <button
                            class="btn secondary"
                            onclick="openPremium()">

                            ⭐ Premium

                        </button>
                        `

                        :

                        `
                        <button
                            class="btn"
                            onclick="openPremium()">

                            Passer à Premium

                        </button>
                        `
                    }

                    <button
                        class="btn secondary"
                        onclick="toggleTheme()">

                        ◐

                    </button>

                    ${avatar(user)}

                </div>

            </header>


            <section class="content" id="content"></section>

        </main>


        <nav class="mobile-nav">

            ${mobileNav("home","⌂","Accueil")}
            ${mobileNav("discover","◉","Découvrir")}
            ${mobileNav("help","?","Aide")}
            ${mobileNav("messages","✉","Messages")}
            ${mobileNav("profile","○","Profil")}

        </nav>

    `;

    renderPage();

}


function navButton(page,label,icon){

    return `
        <button
            class="${currentPage===page?"active":""}"
            onclick="navigate('${page}')">

            ${icon} &nbsp; ${label}

        </button>
    `;
}


function mobileNav(page,icon,label){

    return `
        <button
            class="${currentPage===page?"active":""}"
            onclick="navigate('${page}')">

            <div>${icon}</div>
            ${label}

        </button>
    `;
}


function pageTitle(){

    const titles = {
        home:"Accueil",
        discover:"Découvrir",
        help:"Demandes d'aide",
        messages:"Messages",
        notifications:"Notifications",
        profile:"Mon profil",
        settings:"Paramètres"
    };

    return titles[currentPage] || "Skillink";
}


function navigate(page){

    currentPage=page;
    searchTerm="";
    render();

}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

    const content=document.getElementById("content");

    const user=currentUser();

    content.innerHTML=`

        ${
            !premium
            ?
            `
            <div class="card premium-card">

                <h2>⭐ Découvre Skillink Premium</h2>

                <p class="muted">
                    Débloque des fonctions supplémentaires
                    pour améliorer ton expérience Skillink.
                </p>

                <button
                    class="btn"
                    onclick="openPremium()">

                    Découvrir Premium

                </button>

            </div>
            `
            :
            `
            <div class="card premium-card">

                <h2>⭐ Bienvenue dans Premium, ${escapeHTML(user.name)} !</h2>

                <p class="muted">
                    Toutes tes fonctions Premium sont activées.
                </p>

            </div>
            `
        }


        <div class="card">

            <h2>Créer une publication</h2>

            <div class="form">

                <textarea
                    id="postText"
                    placeholder="Partage quelque chose avec la communauté...">
                </textarea>

                <select id="postCategory">

                    ${SKILLS.map(s=>`
                        <option>${s}</option>
                    `).join("")}

                </select>

                <button
                    class="btn"
                    onclick="createPost()">

                    Publier

                </button>

            </div>

        </div>


        <div class="search-row">

            <input
                class="input"
                placeholder="Rechercher dans les publications..."
                value="${escapeHTML(searchTerm)}"
                oninput="searchPosts(this.value)"
            >

        </div>


        <div id="posts"></div>

    `;

    renderPosts();

}


function searchPosts(value){

    searchTerm=value;

    renderPosts();

}


function renderPosts(){

    const container=document.getElementById("posts");

    if(!container) return;

    let posts=[...data.posts];

    if(searchTerm){

        const q=searchTerm.toLowerCase();

        posts=posts.filter(p=>
            p.text.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q) ||
            userName(p.userId).toLowerCase().includes(q)
        );

    }

    posts.sort((a,b)=>
        new Date(b.createdAt)-new Date(a.createdAt)
    );

    if(!posts.length){

        container.innerHTML=`
            <div class="card empty">
                Aucune publication trouvée.
            </div>
        `;

        return;

    }

    container.innerHTML=posts.map(renderPost).join("");

}


function renderPost(post){

    const u=getUser(post.userId);

    const liked=post.likes.includes(currentUserId());

    return `

        <article class="card">

            <div class="user-row">

                ${avatar(u)}

                <div class="user-info">

                    <div class="user-name">

                        ${userName(post.userId)}

                        ${premiumBadge(u)}

                        ${
                            u?.ai
                            ?
                            `<span class="pill">IA · Démo</span>`
                            :
                            ""
                        }

                    </div>

                    <div class="muted">
                        ${formatDate(post.createdAt)}
                    </div>

                </div>

            </div>


            ${
                post.boosted
                ?
                `
                <div style="margin-top:12px">
                    <span class="pill premium">
                        🚀 Publication mise en avant
                    </span>
                </div>
                `
                :
                ""
            }


            <p class="post-text">
                ${escapeHTML(post.text)}
            </p>


            <span class="pill">
                ${escapeHTML(post.category)}
            </span>


            <div class="post-actions">

                <button
                    class="icon-btn"
                    onclick="toggleLike('${post.id}')">

                    ${liked?"♥":"♡"} ${post.likes.length}

                </button>

                <button
                    class="icon-btn"

function createPost(){

    const text=document.getElementById("postText").value.trim();

    const category=document.getElementById("postCategory").value;

    if(!text){

        showToast("Écris quelque chose avant de publier.");

        return;

    }

    data.posts.push({

        id:uid("post"),

        userId:currentUserId(),

        text,

        category,

        createdAt:now(),

        likes:[],

        comments:[],

        boosted:false

    });

    saveData();

    showToast("Publication créée !");

    renderHome();

}


function toggleLike(id){

    const post=data.posts.find(p=>p.id===id);

    if(!post) return;

    const index=post.likes.indexOf(currentUserId());

    if(index===-1){

        post.likes.push(currentUserId());

    }else{

        post.likes.splice(index,1);

    }

    saveData();

    renderPosts();

}


function addComment(postId){

    const input=document.getElementById("comment-"+postId);

    if(!input) return;

    const text=input.value.trim();

    if(!text) return;

    const post=data.posts.find(p=>p.id===postId);

    post.comments.push({

        id:uid("comment"),

        userId:currentUserId(),

        text,

        createdAt:now()

    });

    saveData();

    renderPosts();

}


function deleteComment(postId,commentId){

    const post=data.posts.find(p=>p.id===postId);

    post.comments=post.comments.filter(
        c=>c.id!==commentId
    );

    saveData();

    renderPosts();

}


function deletePost(id){

    if(!confirm("Supprimer cette publication ?")) return;

    data.posts=data.posts.filter(p=>p.id!==id);

    saveData();

    renderPosts();

}


function boostPost(id){

    if(!premium){

        openPremium();

        return;

    }

    const post=data.posts.find(p=>p.id===id);

    if(post){

        post.boosted=true;

        saveData();

        showToast("🚀 Publication mise en avant !");

        renderPosts();

    }

}


function focusComment(id){

    const input=document.getElementById("comment-"+id);

    if(input) input.focus();

}

    h.answers=h.answers.filter(
        a=>a.id!==answerId

    saveData();

    renderHelpList();

function resolveHelp(id){

    const h=data.helps.find(x=>x.id===id);

        h.resolved=true;

        saveData();

        renderHelpList();

function deleteHelp(id){

        h=>h.id!==id

function getConversation(otherId){

    let c=data.conversations.find(c=>
        c.users.includes(currentUserId()) &&
        c.users.includes(otherId)
    );

    if(!c){

        c={
            id:uid("conversation"),
            users:[currentUserId(),otherId],
            messages:[]
        };

        data.conversations.push(c);

    }

    return c;

}


function startConversation(otherId){

    getConversation(otherId);

function renderChat(otherId){

    const c=getConversation(otherId);

    return `

        <div class="user-row">

            ${avatar(getUser(otherId))}

            <div>

                <strong>
                    ${userName(otherId)}
                </strong>

                ${
                    getUser(otherId)?.ai
                    ?
                    `<div>
                        <span class="pill">
                            IA · Démo
                         </span>
                     </div>`
                    :
                    ""
                }

            </div>

        </div>


        <div class="messages" id="messageList">

            ${
                c.messages.length
                ?
                c.messages.map(m=>`

                    <div class="message ${
                        m.userId===currentUserId()
                        ?"me"
                        :""
                    }">

                        ${escapeHTML(m.text)}

                        <div class="message-time">
                            ${formatDate(m.createdAt)}
                        </div>

                    </div>

                `).join("")
                :
                `
                <div class="empty">
                    Aucun message. Commence la conversation !
                </div>
                `
            }

        </div>


        <div class="chat-input">

            <input
                class="input"
                id="chatInput"
                placeholder="Écrire un message..."
                onkeydown="
                    if(event.key==='Enter')
                    sendMessage('${otherId}')
                "
            >

            <button
                class="btn"
                onclick="sendMessage('${otherId}')">

                Envoyer

            </button>

        </div>

    `;

}


function sendMessage(otherId){

    const input=document.getElementById("chatInput");

    const text=input.value.trim();

    if(!text) return;

    const c=getConversation(otherId);

    c.messages.push({

        id:uid("message"),

        userId:currentUserId(),

        text,

        createdAt:now()

    });

    saveData();

    input.value="";

    renderMessages();

    const other=getUser(otherId);

    if(other?.ai){

        setTimeout(()=>{

            const reply=aiReply(other,text);

            c.messages.push({

                id:uid("message"),

                userId:other.id,

                text:reply,

                createdAt:now()

            });

            saveData();

            renderMessages();

        },700);

    }

}


function aiReply(user,message){

    const text=message.toLowerCase();

    if(user.id==="alex"){

        if(text.includes("arduino"))
            return "Pour Arduino, je te conseillerais plutôt de discuter avec Noah. Moi, je peux surtout t'aider avec la programmation et le web.";

        if(text.includes("html") || text.includes("web"))
            return premium
                ? "Pour un projet web, commence par séparer HTML, CSS et JavaScript. Si tu veux, tu peux aussi créer une petite interface puis ajouter les fonctionnalités une par une."
                : "Pour un projet web, commence par HTML, CSS et JavaScript. Essaie de construire une petite fonctionnalité à la fois.";

        return premium
            ? "Bonne question ! Comme conseil Premium, je te suggère de commencer par définir exactement ce que ton programme doit faire, puis de construire chaque partie séparément."
            : "Bonne question ! Essaie de décrire le problème et on peut le diviser en petites étapes.";

    }

    if(user.id==="sophie"){

        if(text.includes("dessin"))
            return "Pour progresser en dessin, pratique régulièrement les formes simples, les proportions et les ombres.";

        return premium
            ? "Pour le design, pense à la hiérarchie visuelle, à l'espace entre les éléments et à garder une interface simple."
            : "Pour le design, commence par garder une interface simple et facile à comprendre.";

    }

    if(user.id==="noah"){

        if(text.includes("led"))
            return "Une LED est un excellent premier projet. Pense à utiliser une résistance pour limiter le courant.";

        if(text.includes("servo"))
            return "Pour un servo, vérifie son alimentation et commence avec un petit programme qui contrôle progressivement sa position.";

        return premium
            ? "Pour un projet Arduino, je te conseille de tester chaque composant séparément avant de tout connecter. Ça rend le dépannage beaucoup plus facile."
            : "Teste chaque composant séparément avant de construire tout ton projet.";

    }

    if(user.id==="maya"){

        return premium
            ? "Pour apprendre la musique, essaie de pratiquer une petite section à la fois et augmente progressivement la difficulté."
            : "Pratique régulièrement de petites sections plutôt que d'essayer de tout apprendre en même temps.";

    }

    return "Je peux essayer de t'aider avec ça !";

}

                ${["Débutant","Intermédiaire","Avancé"]
                    .map(l=>`
                        <option
                            ${u.level===l?"selected":""}>
                            ${l}
                        </option>
                    `).join("")}

            </select>

            <label>
                Talents
            </label>

            <div>

                ${SKILLS.map(s=>`

                    <label style="display:block;margin:6px 0">

                        <input
                            type="checkbox"
                            value="${escapeHTML(s)}"
                            class="skill-check"
                            ${
                                u.skills.includes(s)
                                ?"checked"
                                :""
                            }
                        >

                        ${escapeHTML(s)}

                    </label>

                `).join("")}

            </div>

            <button
                class="btn"
                onclick="saveProfile()">

                Sauvegarder

            </button>

        </div>

    `);

}


function saveProfile(){

    const u=currentUser();

    u.name=document.getElementById("editName").value.trim();

    u.description=
        document.getElementById("editDescription").value.trim();

    u.level=
        document.getElementById("editLevel").value;

    u.skills=[
        ...document.querySelectorAll(".skill-check:checked")
    ].map(x=>x.value);

    u.premium=premium;

    saveData();

    closeModal();

    showToast("Profil sauvegardé !");

    render();

}

function toggleTheme(){

    localStorage.setItem(
        "skillink_theme",
        document.body.classList.contains("dark")

}


function loadTheme(){

    const theme=localStorage.getItem("skillink_theme");

function login(){

    const name=document
        .getElementById("loginName")
        .value.trim();

    if(!name){

        showToast("Entre ton prénom.");

        return;

    }

    let user=data.users.find(
        u=>u.name.toLowerCase()===name.toLowerCase()
    );

    if(!user){

        user={
            id:uid("user"),
            name,
            description:"Nouveau membre de Skillink.",
            skills:[],
            level:"Débutant",
            ai:false,
            premium:false
        };

        data.users.push(user);

    }

    localStorage.setItem(
        USER_KEY,
        user.id
    );

    premium=user.premium===true;

    if(premium){

        localStorage.setItem(
            PREMIUM_KEY,
            "true"
        );

    }else{

        localStorage.removeItem(
            PREMIUM_KEY
        );

    }

    saveData();

    render();

}


function demoLogin(){

    localStorage.setItem(
        USER_KEY,
        "camille"
    );

    premium=false;

    localStorage.removeItem(
        PREMIUM_KEY
    );

    render();

}


function logout(){

    localStorage.removeItem(USER_KEY);

    showLogin();

}


function resetDemo(){

    if(!confirm(
        "Réinitialiser toutes les données de démonstration ?"
    )) return;

    data=createInitialData();

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

    premium=false;

    localStorage.removeItem(
        PREMIUM_KEY
    );

    localStorage.setItem(
        USER_KEY,
        "camille"
    );

    showToast("Démo réinitialisée.");

    render();

}

            break;

            renderSettings();
            break;

        default:
            renderHome();

    }

}


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    const old=document.querySelector(".toast");

    if(old) old.remove();

    const toast=document.createElement("div");

    toast.className="toast";

    toast.textContent=message;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3000);

}

===================================================== */

if(!localStorage.getItem(USER_KEY)){

    showLogin();

}else{

    const u=currentUser();

    if(u){

        premium=u.premium===true ||
            localStorage.getItem(PREMIUM_KEY)==="true";

        render();

    }else{

        showLogin();

    }

}
