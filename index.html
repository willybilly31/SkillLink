<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skillink : Partage tes talents</title>

<style>
:root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#171c25;
    --muted:#6d7582;
    --border:#e3e7ee;
    --primary:#6366f1;
    --primary2:#4f46e5;
    --primary-light:#eef0ff;
    --danger:#ef4444;
    --danger-light:#fee2e2;
    --success:#22c55e;
    --success-light:#dcfce7;
    --warning:#eab308;
    --warning-light:#fef9c3;
    --sidebar:#ffffff;
    --shadow:0 8px 30px rgba(15,23,42,.07);
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

body.dark{
    --bg:#0f1218;
    --card:#171b22;
    --text:#f1f5f9;
    --muted:#9aa5b4;
    --border:#282f3a;
    --primary:#818cf8;
    --primary2:#6366f1;
    --primary-light:#252947;
    --sidebar:#14181f;
    --shadow:0 8px 30px rgba(0,0,0,.2);
    --danger-light:#3a2024;
    --success-light:#183524;
    --warning-light:#3a3417;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

.muted{
    color:var(--muted);
}

.small-text{
    font-size:13px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-.7px;
}

.logo span{
    color:var(--primary);
}

.sidebar{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:245px;
    background:var(--sidebar);
    border-right:1px solid var(--border);
    padding:22px 15px;
    z-index:30;
}

.sidebar .logo{
    padding:4px 12px 26px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.nav button{
    border:0;
    background:transparent;
    color:var(--text);
    padding:12px 13px;
    text-align:left;
    border-radius:12px;
    transition:.18s;
}

.nav button:hover,
.nav button.active{
    background:var(--primary-light);
    color:var(--primary);
}

.nav .premium-nav{
    margin-top:12px;
    background:#fff7cf;
    color:#876500;
    border:1px solid #e5ca4c;
}

body.dark .nav .premium-nav{
    background:#3a341b;
    color:#f0d666;
    border-color:#675b2a;
}

.main{
    min-height:100vh;
    margin-left:245px;
}

.topbar{
    height:74px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:0 28px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
}

.topbar h1{
    margin:0;
    font-size:21px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.content{
    max-width:1100px;
    margin:0 auto;
    padding:28px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
}

.card h2,
.card h3,
.card h4{
    margin-top:0;
}

.btn{
    border:0;
    padding:10px 15px;
    border-radius:10px;
    background:var(--primary);
    color:#fff;
    font-weight:700;
    transition:.18s;
}

.btn:hover{
    transform:translateY(-1px);
    background:var(--primary2);
}

.btn.secondary{
    background:var(--primary-light);
    color:var(--primary);
}

.btn.danger{
    background:var(--danger);
}

.btn.success{
    background:var(--success);
}

.btn.warning{
    background:var(--warning);
    color:#322900;
}

.btn.small{
    padding:7px 10px;
    font-size:13px;
}

.btn.full{
    width:100%;
}

.icon-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:7px 9px;
    border-radius:8px;
}

.icon-btn:hover{
    background:var(--primary-light);
    color:var(--primary);
}

.input,
textarea,
select{
    width:100%;
    padding:12px 14px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    outline:none;
}

.input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
}

textarea{
    min-height:110px;
    resize:vertical;
}

.form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.three{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--primary-light);
    color:var(--primary);
    font-weight:900;
}

.avatar.large{
    width:94px;
    height:94px;
    font-size:31px;
}

.user-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-info{
    min-width:0;
}

.user-name{
    font-weight:800;
}

.profile-header{
    display:flex;
    align-items:center;
    gap:20px;
}

.profile-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:22px;
}

.stat{
    padding:15px;
    text-align:center;
    border-radius:13px;
    background:var(--primary-light);
}

.stat strong{
    display:block;
    font-size:23px;
    margin-bottom:3px;
}

.pill{
    display:inline-block;
    padding:4px 8px;
    margin:2px 2px 2px 0;
    border-radius:999px;
    background:var(--primary-light);
    color:var(--primary);
    font-size:12px;
    font-weight:700;
}

.pill.premium{
    background:#fff1a6;
    color:#886600;
}

body.dark .pill.premium{
    background:#4b421d;
    color:#f0d56b;
}

.pill.ai{
    background:#ece7ff;
    color:#6d3ed8;
}

body.dark .pill.ai{
    background:#35295a;
    color:#c3a8ff;
}

.post-text{
    line-height:1.6;
    white-space:pre-wrap;
    margin:17px 0;
}

.post-actions{
    border-top:1px solid var(--border);
    margin-top:15px;
    padding-top:11px;
    display:flex;
    flex-wrap:wrap;
    gap:4px;
}

.comment{
    border-top:1px solid var(--border);
    padding:11px 0;
}

.comment-form{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.comment-form input{
    flex:1;
}

.search-row{
    display:flex;
    gap:10px;
}

.search-row .input{
    flex:1;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.user-card{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.empty{
    text-align:center;
    padding:42px 20px;
    color:var(--muted);
}

.help-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

.notification{
    display:flex;
    align-items:flex-start;
    gap:11px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.notification:last-child{
    border-bottom:0;
}

.unread-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--primary);
    margin-top:7px;
    flex-shrink:0;
}

.chat-layout{
    display:grid;
    grid-template-columns:290px 1fr;
    min-height:600px;
}

.conversations{
    border-right:1px solid var(--border);
    padding-right:15px;
    overflow:auto;
}

.conversation{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-radius:12px;
    cursor:pointer;
    margin-bottom:4px;
}

.conversation:hover,
.conversation.active{
    background:var(--primary-light);
}

.chat{
    padding-left:18px;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.messages{
    flex:1;
    max-height:450px;
    overflow:auto;
    padding:12px 4px;
}

.message{
    max-width:75%;
    padding:10px 13px;
    background:var(--border);
    border-radius:14px;
    margin:8px 0;
    line-height:1.4;
}

.message.me{
    margin-left:auto;
    background:var(--primary);
    color:#fff;
}

.message-time{
    font-size:10px;
    opacity:.65;
    margin-top:4px;
}

.chat-input{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.premium-card{
    background:linear-gradient(
        135deg,
        var(--primary-light),
        var(--card)
    );
    border:2px solid #dfc84d;
}

.premium-feature{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.premium-feature:last-child{
    border-bottom:0;
}

.locked{
    opacity:.55;
}

.price{
    font-size:31px;
    font-weight:900;
    margin:10px 0;
}

.price span{
    color:var(--muted);
    font-size:14px;
    font-weight:500;
}

.hero{
    background:linear-gradient(
        135deg,
        var(--primary-light),
        var(--card)
    );
    border:1px solid var(--border);
}

.hero h2{
    font-size:29px;
    margin-bottom:8px;
}

.hero p{
    max-width:680px;
    line-height:1.6;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    width:min(560px,100%);
    max-height:90vh;
    overflow:auto;
    background:var(--card);
    border-radius:20px;
    padding:24px;
    box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.modal-close{
    float:right;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:25px;
}

.toast{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:200;
    padding:13px 17px;
    border-radius:12px;
    background:var(--text);
    color:var(--bg);
    box-shadow:var(--shadow);
}

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:min(470px,100%);
}

.auth-logo{
    text-align:center;
    margin-bottom:25px;
}

.auth-logo .logo{
    display:inline-block;
    font-size:32px;
}

.divider{
    height:1px;
    background:var(--border);
    margin:20px 0;
}

.global-search{
    position:relative;
}

.global-results{
    margin-top:10px;
}

.result-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.result-item:hover{
    background:var(--primary-light);
}

.result-item:last-child{
    border-bottom:0;
}

.badge-count{
    min-width:19px;
    height:19px;
    padding:0 5px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:999px;
    background:var(--danger);
    color:#fff;
    font-size:11px;
    font-weight:800;
    margin-left:4px;
}

.mobile-nav{
    display:none;
}

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        padding-bottom:70px;
    }

    .topbar{
        padding:0 16px;
    }

    .content{
        padding:18px;
    }

    .mobile-nav{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        display:flex;
        justify-content:space-around;
        background:var(--card);
        border-top:1px solid var(--border);
        z-index:40;
        padding:7px 4px;
    }

    .mobile-nav button{
        background:transparent;
        border:0;
        color:var(--muted);
        font-size:11px;
    }

    .mobile-nav button.active{
        color:var(--primary);
    }

    .grid{
        grid-template-columns:1fr;
    }

    .chat-layout{
        grid-template-columns:1fr;
    }

    .conversations{
        border-right:0;
        border-bottom:1px solid var(--border);
        padding-right:0;
        padding-bottom:10px;
        margin-bottom:10px;
        max-height:220px;
    }

    .chat{
        padding-left:0;
    }

    .profile-header{
        align-items:flex-start;
        flex-direction:column;
    }

    .profile-stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:520px){

    .two,
    .three{
        grid-template-columns:1fr;
    }

    .topbar h1{
        font-size:18px;
    }

    .top-actions .btn{
        padding:8px 10px;
        font-size:12px;
    }

    .content{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    .message{
        max-width:88%;
    }
}
</style>
</head>

/* =========================================================
   OUTILS
========================================================= */

function uid(prefix="id"){
    return prefix + "_" + Math.random().toString(36).slice(2,10);
}

function now(){
    return new Date().toISOString();
}

function escapeHTML(text=""){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function formatDate(date){
    return new Date(date).toLocaleString("fr-CA",{
        day:"numeric",
        month:"short",
        hour:"2-digit",
        minute:"2-digit"
    });
}

function currentUser(){
    return data.users.find(u=>u.id===currentUserId);
}

function getUser(id){
    return data.users.find(u=>u.id===id);
}

function userName(id){
    const user = getUser(id);
    return user ? escapeHTML(user.name) : "Utilisateur";
}

function showToast(message){
    document.querySelector(".toast")?.remove();

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = message;

    document.body.appendChild(toast);

    setTimeout(()=>{
        toast.remove();
    },3000);
}

function avatar(user,large=false){
    if(!user) return "";

    return `
        <div class="avatar ${large ? "large" : ""}">
            ${escapeHTML(user.name.charAt(0).toUpperCase())}
        </div>
    `;
}

function premiumBadge(user){
    if(!user?.premium) return "";

    return `
        <span class="pill premium">
            ⭐ Premium
        </span>
    `;
}

/* =========================================================
   INITIALISATION
========================================================= */

function resetEverything(){

    /*
        Aucun localStorage.
        Chaque chargement recrée complètement
        les données de démonstration.
    */

    data = createInitialData();

    currentUserId = null;

    currentPage = "home";

    selectedConversation = null;

    searchTerm = "";

    premium = false;

    darkMode = false;

    document.body.classList.remove("dark");
}

resetEverything();

function login(){

    const name = document
        .getElementById("loginName")
        .value
        .trim();

    if(!name){
        showToast("Entre ton prénom.");
        return;
    }

    const user = data.users.find(
        u=>u.name.toLowerCase()===name.toLowerCase()
    );

    if(!user){

        showToast(
            "Compte non trouvé. Utilise la création de compte."
        );

        return;
    }

    currentUserId = user.id;

    premium = user.premium;

    render();

}


function register(){

    const name = document
        .getElementById("registerName")
        .value
        .trim();

    if(!name){
        showToast("Entre ton prénom.");
        return;
    }

    const exists = data.users.some(
        u=>u.name.toLowerCase()===name.toLowerCase()
    );

    if(exists){

        showToast(
            "Ce prénom existe déjà. Utilise la connexion."
        );

        return;
    }

    const user = {
        id:uid("user"),
        name,
        description:"Nouveau membre de Skillink.",
        skills:[],
        level:"Débutant",
        ai:false,
        premium:false
    };

    data.users.push(user);

    currentUserId = user.id;

    premium = false;

    showToast("Compte créé !");

    render();

}

function createPost(){

    const text = document
        .getElementById("postText")
        .value
        .trim();

    const category = document
        .getElementById("postCategory")
        .value;

    if(!text){

        showToast(
            "Écris quelque chose avant de publier."
        );

        return;
    }

    data.posts.unshift({

        id:uid("post"),

        userId:currentUserId,

        text,

        category,

        createdAt:now(),

        likes:[],

        comments:[],

        boosted:false

    });

    showToast("Publication créée !");

    renderHome();

}


function searchPosts(value){

    searchTerm = value.toLowerCase();

    renderPosts();

}


function renderPosts(){

    const container = document.getElementById("posts");

    if(!container) return;

    let posts = [...data.posts];

    if(searchTerm){

        posts = posts.filter(post=>{

            const text = [
                post.text,
                post.category,
                getUser(post.userId)?.name || ""
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(searchTerm);

        });

    }

    posts.sort((a,b)=>{

        if(a.boosted && !b.boosted) return -1;

        if(!a.boosted && b.boosted) return 1;

        return new Date(b.createdAt)-new Date(a.createdAt);

    });


    if(!posts.length){

        container.innerHTML=`

            <div class="card empty">
                Aucune publication trouvée.
            </div>

        `;

        return;
    }

    container.innerHTML = posts.map(renderPost).join("");

}


function renderPost(post){

    const user = getUser(post.userId);

    const liked =
        post.likes.includes(currentUserId);


    return `

        <article class="card">

            <div class="user-row">

                ${avatar(user)}

                <div class="user-info">

                    <div class="user-name">

                        ${userName(post.userId)}

                        ${premiumBadge(user)}

                        ${
                            user?.ai
                            ?
                            `

                                IA · Démo

                            `
                            :
                            ""
                        }

                    </div>


                    <div class="muted small-text">
                        ${formatDate(post.createdAt)}
                    </div>

                </div>

            </div>


            ${
                post.boosted
                ?
                `
                <div style="margin-top:12px">

                    <span class="pill premium">
                        Publication Premium mise en avant
                    </span>

                </div>
                `
                :
                ""
            }


            <p class="post-text">
                ${escapeHTML(post.text)}
            </p>


            <span class="pill">
                ${escapeHTML(post.category)}
            </span>


            <div class="post-actions">

                <button

                    ${liked ? "♥" : "♡"}
                    ${post.likes.length}

                </button>


                <button
                    class="icon-btn"
                    onclick="focusComment('${post.id}')">

                    💬 ${post.comments.length}

                </button>


                <button
                    class="icon-btn"
                    onclick="reportItem('publication')">

                    ⚑ Signaler

                </button>


                ${
                    post.userId===currentUserId
                    ?
                    `
                    <button
                        class="icon-btn"
                        onclick="deletePost('${post.id}')">

                        Supprimer

                    </button>
                    `
                    :
                    ""
                }


                ${
                    premium &&
                    post.userId===currentUserId &&
                    !post.boosted
                    ?
                    `
                    <button
                        class="icon-btn"
                        onclick="boostPost('${post.id}')">

                        Mettre en avant

                    </button>
                    `
                    :
                    ""
                }

            </div>


            <div>

                ${
                    post.comments.length
                    ?
                    post.comments.map(comment=>`

                        <div class="comment">

                            <div class="user-row">

                                ${avatar(getUser(comment.userId))}

                                <div>

                                    <div class="user-name">

                                        ${userName(comment.userId)}

                                    </div>

                                    <div>
                                        ${escapeHTML(comment.text)}
                                    </div>

                                    <div class="muted small-text">
                                        ${formatDate(comment.createdAt)}
                                    </div>

                                </div>

                            </div>


                            ${
                                comment.userId===currentUserId
                                ?
                                `
                                <button
                                    class="icon-btn"
                                    onclick="
                                        deleteComment(
                                            '${post.id}',
                                            '${comment.id}'
                                        )
                                    ">

                                    Supprimer

                                </button>
                                `
                                :
                                ""
                            }

                        </div>

                    `).join("")
                    :
                    ""
                }


                <div class="comment-form">

                    <input
                        id="comment-${post.id}"
                        placeholder="Écrire un commentaire..."
                    >

                    <button
                        class="btn small"
                        onclick="addComment('${post.id}')">

                        Envoyer

                    </button>

                </div>

            </div>

        </article>

    `;

}


function toggleLike(id){

    const post = data.posts.find(
        p=>p.id===id
    );

    if(!post) return;

    const index = post.likes.indexOf(
        currentUserId
    );

    if(index===-1){
        post.likes.push(currentUserId);
    }else{
        post.likes.splice(index,1);
    }

    renderPosts();

}


function addComment(postId){

    const input =
        document.getElementById(
            "comment-"+postId
        );

    if(!input) return;

    const text = input.value.trim();

    if(!text) return;

    const post =
        data.posts.find(p=>p.id===postId);

    if(!post) return;

    post.comments.push({

        id:uid("comment"),

        userId:currentUserId,

        text,

        createdAt:now()

    });

    input.value="";

    renderPosts();

}


function deleteComment(postId,commentId){

    const post =
        data.posts.find(p=>p.id===postId);

    if(!post) return;

    post.comments =
        post.comments.filter(
            c=>c.id!==commentId
        );

    renderPosts();

}


function deletePost(id){

    if(!confirm(
        "Supprimer cette publication ?"
    )) return;

    data.posts =
        data.posts.filter(
            p=>p.id!==id
        );

    renderPosts();

}


function boostPost(id){

    if(!premium){

        openPremium();

        return;
    }

    const post =
        data.posts.find(p=>p.id===id);

    if(!post) return;

    post.boosted = true;

    showToast(
        "Publication mise en avant."
    );

    renderPosts();

}


function focusComment(id){

    setTimeout(()=>{

        document
            .getElementById("comment-"+id)
            ?.focus();

    },50);

}

function renderUsers(){

    const container =
        document.getElementById("users");

    if(!container) return;

    const search =
        document
            .getElementById("discoverSearch")
            ?.value
            .toLowerCase()
            .trim() || "";

    const skill =
        document
            .getElementById("discoverSkill")
            ?.value || "";


    let users =
        data.users.filter(
            u=>u.id!==currentUserId
        );


    users = users.filter(user=>{

        const text = [
            user.name,
            user.description,
            user.level,
            ...user.skills
        ]
        .join(" ")
        .toLowerCase();

        const matchesSearch =
            !search ||
            text.includes(search);

        const matchesSkill =
            !skill ||
            user.skills.includes(skill);

        return matchesSearch && matchesSkill;

    });


    if(!users.length){

        container.innerHTML=`

            <div class="card empty">

                Aucun utilisateur trouvé.

            </div>

        return;

    container.innerHTML =
        users.map(renderUserCard).join("");

                        class="btn small"
                        onclick="
                            answerHelp('${help.id}')
                        ">

                        Répondre

                    </button>

                </div>
                `
                :
                ""
            }


            ${
                help.userId===currentUserId
                ?
                `
                <div class="post-actions">

                    ${
                        !help.resolved
                        ?
                        `
                        <button
                            class="btn success small"
                            onclick="
                                resolveHelp('${help.id}')
                            ">

                            Marquer comme résolue

                        </button>
                        `
                        :
                        ""
                    }


                    <button
                        class="btn danger small"
                        onclick="
                            deleteHelp('${help.id}')
                        ">

                        Supprimer

                    </button>

                </div>
                `
                :
                ""
            }

        </div>

    `;

}


function answerHelp(id){

    const input =
        document.getElementById(
            "answer-"+id
        );

    const text =
        input?.value.trim();

    if(!text) return;

    const help =
        data.helps.find(
            h=>h.id===id
        );

    if(!help) return;


    help.answers.push({

        id:uid("answer"),

        userId:currentUserId,

        text,

        createdAt:now()

    });


    input.value="";

    renderHelpList();

}


function deleteAnswer(helpId,answerId){

    const help =
        data.helps.find(
            h=>h.id===helpId
        );

    if(!help) return;

    help.answers =
        help.answers.filter(
            a=>a.id!==answerId
        );

    renderHelpList();

}


function resolveHelp(id){

    const help =
        data.helps.find(
            h=>h.id===id
        );

    if(!help) return;

    help.resolved=true;

    renderHelpList();

}


function deleteHelp(id){

    data.helps =
        data.helps.filter(
            h=>h.id!==id
        );

    renderHelpList();

}

function getConversation(otherId){

    let conversation =
        data.conversations.find(c=>
            c.users.includes(currentUserId) &&
            c.users.includes(otherId)
        );


    if(!conversation){

        conversation = {

            id:uid("conversation"),

            users:[
                currentUserId,
                otherId
            ],

            messages:[]

        };

        data.conversations.push(
            conversation
        );

    }


    return conversation;

}


function startConversation(otherId){

    getConversation(otherId);

    selectedConversation = otherId;

    currentPage="messages";

    render();

}


function renderMessages(){

    const content =

        data.conversations.filter(

            <div class="chat-layout">

function selectConversation(id){

function renderChat(otherId){

    const conversation =
        getConversation(otherId);

    const other =
        getUser(otherId);


    return `

        <div class="user-row">

            ${avatar(other)}

            <div>

                <strong>
                    ${escapeHTML(other.name)}
                </strong>


                <div>

                    ${
                        other.ai
                        ?
                        `
                        <span class="pill ai">
                            IA · Démo
                        </span>
                        `
                        :
                        ""
                    }

                    ${premiumBadge(other)}

                </div>

            </div>

        </div>


        <div class="messages">

            ${
                conversation.messages.length
                ?
                conversation.messages.map(message=>`

                    <div
                        class="
                            message
                            ${
                                message.userId===currentUserId
                                ?"me"
                                :""
                            }
                        ">

                        ${escapeHTML(message.text)}

                        <div class="message-time">

                            ${formatDate(message.createdAt)}

                        </div>

                    </div>

                `).join("")
                :
                `
                <div class="empty">
                    Aucun message. Commence la conversation !
                </div>
                `
            }

        </div>


        <div class="chat-input">

            <input
                class="input"
                id="chatInput"
                placeholder="Écrire un message..."
                onkeydown="
                    if(event.key==='Enter'){
                        sendMessage('${otherId}')
                    }
                "
            >


            <button
                class="btn"
                onclick="
                    sendMessage('${otherId}')
                ">

                Envoyer

            </button>

        </div>

    `;

}


function sendMessage(otherId){

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input?.value.trim();

    if(!text) return;


    const conversation =
        getConversation(otherId);


    conversation.messages.push({

        id:uid("message"),

        userId:currentUserId,

        text,

        createdAt:now()

    });


    input.value="";

    renderMessages();


    const other =
        getUser(otherId);


    if(other?.ai){

        setTimeout(()=>{

            const reply =
                aiReply(
                    other,
                    text
                );


            conversation.messages.push({

                id:uid("message"),

                userId:other.id,

                text:reply,

                createdAt:now()

            });


            renderMessages();

        },700);

    }

}


/* =========================================================
   IA
========================================================= */

function aiReply(user,message){

    const text =
        message.toLowerCase();


    if(user.id==="alex"){

        if(
            text.includes("arduino") ||
            text.includes("servo") ||
            text.includes("led")
        ){

            return "Pour Arduino et l'électronique, Noah pourra probablement mieux t'aider. Moi, je suis surtout spécialisé en programmation et en projets web.";

        }


        if(
            text.includes("html") ||
            text.includes("javascript") ||
            text.includes("css") ||
            text.includes("web")
        ){

            if(premium){

                return "Pour un projet web, je te conseille de séparer clairement HTML, CSS et JavaScript. Commence par construire une petite fonctionnalité, teste-la, puis ajoute la suivante. Ça évite de créer beaucoup de problèmes en même temps.";

            }

            return "Pour un projet web, commence par HTML, CSS et JavaScript. Construis une petite fonctionnalité à la fois.";

        }


        if(premium){

            return "Bonne question. Une bonne méthode consiste à décrire exactement le résultat attendu, découper le problème en petites parties, puis tester chaque partie séparément.";

        }

        return "Décris ton problème et on peut essayer de le diviser en petites étapes.";

    }


    if(user.id==="sophie"){

        if(
            text.includes("dessin") ||
            text.includes("dessiner")
        ){

            return "Pour progresser en dessin, pratique les formes simples, les proportions, les ombres et essaie de dessiner régulièrement.";

        }


        if(premium){

            return "En design, pense surtout à la hiérarchie visuelle, aux espaces entre les éléments, à la lisibilité et à la simplicité. Une bonne interface n'a pas besoin d'être compliquée.";

        }

        return "Pour le design, garde ton interface simple et facile à comprendre.";

    }


    if(user.id==="noah"){

        if(text.includes("led")){

            return "Une LED est un excellent premier projet Arduino. N'oublie pas d'utiliser une résistance avec la LED pour limiter le courant.";

        }


        if(text.includes("servo")){

            return "Pour un servo, vérifie d'abord son alimentation et teste-le avec un programme très simple avant de l'intégrer dans le reste du projet.";

        }


        if(text.includes("arduino")){

            if(premium){

                return "Pour apprendre Arduino, je te conseille de commencer par des projets très simples : LED, bouton, buzzer, potentiomètre, puis capteurs et servos. Teste toujours un composant à la fois.";

            }

            return "Commence par une LED et un bouton, puis ajoute progressivement de nouveaux composants.";

        }


        return "Explique-moi ton projet Arduino et on pourra essayer de trouver une solution ensemble.";

    }


    if(user.id==="maya"){

        if(premium){

            return "Pour apprendre la musique, pratique régulièrement de petites sections, travaille lentement au début et augmente progressivement la difficulté.";

        }

        return "Pratique régulièrement de petites sections plutôt que d'essayer d'apprendre tout d'un coup.";

    }


    return "Je peux essayer de t'aider avec ça !";

}

function saveProfile(){

        document.getElementById(
            "editName"
        ).value.trim();


    if(!name){

        showToast(
            "Le nom ne peut pas être vide."
        );

        return;
    }


    user.name=name;

    user.description =
        document.getElementById(
            "editDescription"
        ).value.trim();


    user.level =
        document.getElementById(
            "editLevel"
        ).value;


    user.skills = [
        ...document.querySelectorAll(
            ".skill-check:checked"
        )
    ].map(
        checkbox=>checkbox.value
    );


    user.premium=premium;

    closeModal();

    showToast(
        "Profil sauvegardé !"
    );

    render();

function cancelPremium(){

    showToast(

function toggleTheme(){

    darkMode=!darkMode;

    document.body.classList.toggle(
        "dark",
        darkMode
    );

    render();

/* =========================================================
   MODALE
========================================================= */

function openModal(html){

    closeModal();


    const overlay =
        document.createElement("div");

    overlay.id="modal";

    overlay.className=
        "modal-overlay";


    overlay.innerHTML=`

        <div class="modal">

            ${html}

        </div>

    `;


    overlay.addEventListener(
        "click",
        event=>{

            if(event.target===overlay){
                closeModal();
            }

        }
    );


    document.body.appendChild(
        overlay
    );

}


function closeModal(){

    document
        .getElementById("modal")
        ?.remove();

}


/* =========================================================
   RECHERCHE GLOBALE
========================================================= */

function openGlobalSearch(){

    openModal(`

        <button
            class="modal-close"
            onclick="closeModal()">

            ×

        </button>


        <h2>
            Recherche globale
        </h2>


        <p class="muted">
            Recherche parmi les utilisateurs,
            publications et demandes d'aide.
        </p>


        <input
            class="input"
            id="globalSearchInput"
            placeholder="Rechercher..."
            oninput="globalSearch(this.value)"
            autofocus
        >


        <div
            id="globalResults"
            class="global-results">

            <div class="empty">
                Commence à écrire une recherche.
            </div>

        </div>

    `);

}


function globalSearch(value){

    const container =
        document.getElementById(
            "globalResults"
        );

    if(!container) return;


    const query =
        value.toLowerCase().trim();


    if(!query){

        container.innerHTML=`

            <div class="empty">
                Commence à écrire une recherche.
            </div>

        `;

        return;
    }


    const users =
        data.users.filter(user=>{

            const text=[
                user.name,
                user.description,
                user.level,
                ...user.skills
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(query);

        });


    const posts =
        data.posts.filter(post=>{

            const text=[
                post.text,
                post.category
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(query);

        });


    const helps =
        data.helps.filter(help=>{

            const text=[
                help.title,
                help.description,
                help.category
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(query);

        });


    if(
        !users.length &&
        !posts.length &&
        !helps.length
    ){

        container.innerHTML=`

            <div class="empty">
                Aucun résultat.
            </div>

        `;

        return;
    }


    container.innerHTML=`

        ${
            users.length
            ?
            `
            <h3>
                Utilisateurs
            </h3>

            ${users.map(user=>`

                <div
                    class="result-item"
                    onclick="
                        closeModal();
                        viewProfile('${user.id}')
                    ">

                    ${avatar(user)}

                    <div>

                        <strong>
                            ${escapeHTML(user.name)}
                        </strong>

                        <div class="muted small-text">
                            ${escapeHTML(user.description)}
                        </div>

                    </div>

                </div>

            `).join("")}
            `
            :
            ""
        }


        ${
            posts.length
            ?
            `
            <h3 style="margin-top:20px">
                Publications
            </h3>

            ${posts.slice(0,10).map(post=>`

                <div
                    class="result-item"
                    onclick="
                        closeModal();
                        navigate('home')
                    ">

                    <div>

                        <strong>
                            ${userName(post.userId)}
                        </strong>

                        <div>
                            ${escapeHTML(post.text)}
                        </div>

                        <span class="pill">
                            ${escapeHTML(post.category)}
                        </span>

                    </div>

                </div>

            `).join("")}
            `
            :
            ""
        }


        ${
            helps.length
            ?
            `
            <h3 style="margin-top:20px">
                Demandes d'aide
            </h3>

            ${helps.slice(0,10).map(help=>`

                <div
                    class="result-item"
                    onclick="
                        closeModal();
                        navigate('help')
                    ">

                    <div>

                        <strong>
                            ${escapeHTML(help.title)}
                        </strong>

                        <div class="muted small-text">
                            ${escapeHTML(help.category)}
                        </div>

                    </div>

                </div>

            `).join("")}
            `
            :
            ""
        }

    `;

}

function reportItem(type){

    openModal(`

        <button
            class="modal-close"

            ×

            <button
                class="btn secondary"
                onclick="submitReport('Harcèlement')">

                Harcèlement

            </button>


            <button
                class="btn secondary"
                onclick="submitReport('Spam')">

                Spam

            </button>

                class="btn secondary"

function submitReport(reason){

}
